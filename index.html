
<!DOCTYPE html>
<html lang="en-us" class="ggc-custom-cursor">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Guns, Gore, and Cannoli 2</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #808080;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #808080;
      outline: none;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      display: none;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,.15);
      border-radius: 5px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #d8b24a;
      transition: width .15s linear;
    }

    #unity-warning {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      display: none;
      color: #fff;
    }

    html.ggc-custom-cursor,
    html.ggc-custom-cursor *,
    body.ggc-custom-cursor,
    body.ggc-custom-cursor * {
      cursor: none !important;
    }

    html.ggc-custom-cursor #ggc-web-input {
      cursor: text !important;
    }
  </style>
</head>

<body class="ggc-custom-cursor">
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-warning"></div>
</div>

<script>
const canvas = document.querySelector("#unity-canvas");
const loadingBar = document.querySelector("#unity-loading-bar");
const progressBarFull = document.querySelector("#unity-progress-bar-full");
const warningBanner = document.querySelector("#unity-warning");

function unityShowBanner(msg, type) {
  const div = document.createElement("div");
  div.innerHTML = msg;

  if (type === "error") {
    div.style = "background:red;padding:10px;";
  } else {
    div.style = "background:yellow;color:#000;padding:10px;";
    setTimeout(() => div.remove(), 5000);
  }

  warningBanner.appendChild(div);
  warningBanner.style.display = "block";
}

function fitCanvasToWindow() {
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}

fitCanvasToWindow();
window.addEventListener("resize", fitCanvasToWindow);

const buildUrl = "Build";
const CHUNK_SIZE = 20 * 1024 * 1024;

async function loadSplitFile(filename) {
  const base = buildUrl + "/" + filename;
  const firstResponse = await fetch(base + ".000");

  if (!firstResponse.ok) {
    throw new Error("Could not load chunk: " + filename + ".000");
  }

  const firstChunk = await firstResponse.arrayBuffer();

  const chunks = [firstChunk];
  let index = 1;

  while (chunks[chunks.length - 1].byteLength === CHUNK_SIZE) {
    const chunkName = filename + "." + String(index).padStart(3, "0");

    const response = await fetch(base + "." + String(index).padStart(3, "0"));

    if (response.status === 404) break;

    if (!response.ok) {
      throw new Error("Failed to load " + chunkName);
    }

    const data = await response.arrayBuffer();
    chunks.push(data);

    index++;
  }

  const totalSize = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);
  const combined = new Uint8Array(totalSize);

  let offset = 0;

  for (const chunk of chunks) {
    combined.set(new Uint8Array(chunk), offset);
    offset += chunk.byteLength;
  }

  console.log(filename + " loaded:", totalSize, "bytes,", chunks.length, "chunks");

  return combined.buffer;
}

async function startGame() {
  loadingBar.style.display = "block";

  try {
    const [dataBuffer, wasmBuffer] = await Promise.all([
      loadSplitFile("WebGL.data"),
      loadSplitFile("WebGL.wasm")
    ]);

    const config = {
      dataUrl: URL.createObjectURL(
        new Blob([dataBuffer], { type: "application/octet-stream" })
      ),

      frameworkUrl: buildUrl + "/WebGL.framework.js",

      codeUrl: URL.createObjectURL(
        new Blob([wasmBuffer], { type: "application/wasm" })
      ),

      streamingAssetsUrl: "StreamingAssets",

      companyName: "Crazy Monkey Studios",
      productName: "Guns, Gore, and Cannoli 2",
      productVersion: "gogrelease_1.0.8",

      showBanner: unityShowBanner
    };

    const script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        canvas.focus();
        window.unityInstance = unityInstance;
      }).catch((error) => {
        console.error(error);
        unityShowBanner(String(error), "error");
      });
    };

    script.onerror = () => {
      unityShowBanner("Failed to load Unity loader.", "error");
    };

    document.body.appendChild(script);

  } catch (error) {
    console.error(error);
    unityShowBanner("Loading failed: " + error.message, "error");
  }
}

startGame();
</script>
</body>
</html>
